// ---------- Almacenamiento COMPARTIDO (Netlify Blobs, vía la función /api/datos) ----------
// Todos los dispositivos que abran esta misma web leen y escriben aquí, así que
// el menú, la lista de la compra, etc. se comparten entre todos.
window.__almacenamientoLimitado = false;

window.storage = {
  get: async function (key) {
    const resp = await fetch(`/api/datos?key=${encodeURIComponent(key)}`);
    if (!resp.ok) throw new Error("Error al leer los datos compartidos");
    const datos = await resp.json();
    if (datos.value === null || datos.value === undefined) {
      throw new Error("clave no encontrada: " + key);
    }
    return { key, value: datos.value, shared: true };
  },
  set: async function (key, value) {
    const resp = await fetch("/api/datos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, value }),
    });
    if (!resp.ok) throw new Error("Error al guardar los datos compartidos");
    return { key, value, shared: true };
  },
};


// ---------- Icono de línea genérico (sustituye a lucide-react para no depender de paquetes externos) ----------
function Icono({ nombre, size = 16, style = {} }) {
  const comun = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: style.color || "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style: { display: "block", flexShrink: 0, ...style } };
  switch (nombre) {
    case "x": return <svg {...comun}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
    case "plus": return <svg {...comun}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    case "check": return <svg {...comun}><polyline points="20 6 9 17 4 12" /></svg>;
    case "chevron-down": return <svg {...comun}><polyline points="6 9 12 15 18 9" /></svg>;
    case "chevron-left": return <svg {...comun}><polyline points="15 18 9 12 15 6" /></svg>;
    case "chevron-right": return <svg {...comun}><polyline points="9 18 15 12 9 6" /></svg>;
    case "rotate-ccw": return <svg {...comun}><path d="M3 12a9 9 0 1 0 2.6-6.4" /><polyline points="3 3 3 9 9 9" /></svg>;
    case "copy": return <svg {...comun}><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>;
    case "calendar": return <svg {...comun}><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>;
    case "clock": return <svg {...comun}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>;
    case "sparkles": return <svg {...comun}><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3z" /><path d="M19 17l0.6 1.6L21 19l-1.4 0.6L19 21l-0.6-1.4L17 19l1.4-0.4z" /></svg>;
    case "info": return <svg {...comun}><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><circle cx="12" cy="8" r="0.5" fill={style.color || "currentColor"} /></svg>;
    case "cart": return <svg {...comun}><circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" /><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6" /></svg>;
    case "download": return <svg {...comun}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>;
    case "upload": return <svg {...comun}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></svg>;
    case "share": return <svg {...comun}><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.6" y1="10.5" x2="15.4" y2="6.5" /><line x1="8.6" y1="13.5" x2="15.4" y2="17.5" /></svg>;
    case "undo": return <svg {...comun}><path d="M3 7v6h6" /><path d="M3.5 13a9 9 0 1 0 2.6-7.4L3 8" /></svg>;
    default: return null;
  }
}

// ---------- Objetivos alimentarios automáticos ----------
function catCant(dist, key) { return dist.categorias.find((c) => c.key === key)?.cantidad || 0; }
function catPct(dist, key) { return dist.categorias.find((c) => c.key === key)?.pct || 0; }

const POOL_OBJETIVOS = [
  { id: "verdura3", texto: "Verduras en 3 o más platos", check: (d) => catCant(d, "verdura") >= 3 },
  { id: "fruta2", texto: "Fruta en 2 o más platos", check: (d) => catCant(d, "fruta") >= 2 },
  { id: "proteina4", texto: "Proteína en 4 o más platos", check: (d) => catCant(d, "proteina") >= 4 },
  { id: "lacteo2", texto: "Lácteos en 2 o más platos", check: (d) => catCant(d, "lacteo") >= 2 },
  { id: "carbo3", texto: "Carbohidratos en 3 o más platos", check: (d) => catCant(d, "carbohidrato") >= 3 },
  { id: "dulceMax2", texto: "Máximo 2 dulces/otros esta semana", check: (d) => d.total > 0 && catCant(d, "otros") <= 2 },
  { id: "verduraPct", texto: "Verdura en al menos 1 de cada 3 platos", check: (d) => d.total > 0 && catPct(d, "verdura") >= 33 },
  { id: "planificar8", texto: "Planificar 8 o más platos", check: (d) => d.total >= 8 },
  { id: "variedadCat", texto: "4 o más categorías distintas en la semana", check: (d) => d.categorias.filter((c) => c.cantidad > 0).length >= 4 },
  { id: "frutaVerduraMitad", texto: "Fruta o verdura en la mitad de los platos", check: (d) => d.total > 0 && catCant(d, "fruta") + catCant(d, "verdura") >= Math.ceil(d.total / 2) },
];

function hashCadena(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
}
function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function objetivosParaSemana(claveMonday) {
  const rand = mulberry32(hashCadena(claveMonday));
  const indices = POOL_OBJETIVOS.map((_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  return indices.slice(0, 3).map((i) => POOL_OBJETIVOS[i]);
}
function fechaDesdeClave(fk) {
  const [y, m, d] = fk.split("-").map(Number);
  return new Date(y, m - 1, d);
}

// Palabras clave -> emoji + categoría nutricional aproximada

  { claves: ["zanahoria"], emoji: "🥕", categoria: "verdura" },

  { claves: ["pescado", "salmón", "salmon", "atún", "atun", "merluza", "gamba", "marisco"], emoji: "🐟", categoria: "proteina" },
  { claves: ["carne", "filete", "ternera", "cerdo", "pollo", "pavo", "hamburguesa", "solomillo"], emoji: "🍖", categoria: "proteina" },

function infoParaTexto(texto) {
  const t = (texto || "").toLowerCase();
  for (const grupo of MAPA_ICONOS) {
    if (grupo.claves.some((c) => t.includes(c))) return grupo;
  }
  return { emoji: "🧑‍🍳", categoria: "otros" };
}
function emojiParaTexto(texto) { return infoParaTexto(texto).emoji; }
function categoriaParaTexto(texto) { return infoParaTexto(texto).categoria; }

function lunesDe(fecha) {
  const d = new Date(fecha);
  const dia = d.getDay();
  const diferencia = dia === 0 ? -6 : 1 - dia;
  d.setDate(d.getDate() + diferencia);
  d.setHours(0, 0, 0, 0);
  return d;
}
function claveFecha(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function formatoSello(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return d.toLocaleString("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function generarId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function normalizarSlot(v) {
  if (!v) return { items: [] };
  if (Array.isArray(v.items)) return { items: v.items.map((it) => ({ id: it.id || generarId(), texto: it.texto || "", creadoEn: it.creadoEn || null })) };
  if (typeof v === "string") return v.trim() ? { items: [{ id: generarId(), texto: v, creadoEn: null }] } : { items: [] };
  if (typeof v.texto === "string") return v.texto.trim() ? { items: [{ id: generarId(), texto: v.texto, creadoEn: v.creadoEn || null }] } : { items: [] };
  return { items: [] };
}
function slotsVacios() { return { comida: { items: [] }, cena: { items: [] } }; }
function normalizarSlots(raw) {
  const base = raw || {};
  const resultado = {};
  COMIDAS.forEach(({ key }) => (resultado[key] = normalizarSlot(base[key])));
  return resultado;
}

const CLAVE_PLANES = "planes-por-fecha";
const CLAVE_COMPRA = "lista-compra-check";
const CLAVE_CATEGORIAS = "categorias-manuales";
const CLAVE_INGREDIENTES = "ingredientes-manuales";

function PlanificadorComidas() {
  const [pestaña, setPestaña] = useState("planificador");
  const [planesPorFecha, setPlanesPorFecha] = useState({});
  const [semanaBase, setSemanaBase] = useState(() => lunesDe(new Date()));
  const [marcados, setMarcados] = useState({});
  const [categoriasManuales, setCategoriasManuales] = useState({});
  const [ingredientesManuales, setIngredientesManuales] = useState({});
  const [añadiendoIngredientes, setAñadiendoIngredientes] = useState(null);
  const [borradorIngredientes, setBorradorIngredientes] = useState("");
  const [editando, setEditando] = useState(null);
  const [borrador, setBorrador] = useState("");
  const [borrarAbierto, setBorrarAbierto] = useState(false);
  const [cargando, setCargando] = useState(true);
  const [aviso, setAviso] = useState(null);
  const [estadoGuardado, setEstadoGuardado] = useState({ ok: true, en: null });
  const [añoSeleccionado, setAñoSeleccionado] = useState(() => new Date().getFullYear());
  const [ultimoBorrado, setUltimoBorrado] = useState(null);
  const inputImportarRef = useRef(null);

  const hoyClave = useMemo(() => claveFecha(new Date()), []);
  const añoActual = new Date().getFullYear();

  const fechasSemana = useMemo(
    () => Array.from({ length: 7 }, (_, i) => { const d = new Date(semanaBase); d.setDate(d.getDate() + i); return d; }),
    [semanaBase]
  );

  useEffect(() => {
    (async () => {
      try { const p = await window.storage.get(CLAVE_PLANES); if (p?.value) setPlanesPorFecha(JSON.parse(p.value)); } catch (_) {}
      try { const c = await window.storage.get(CLAVE_COMPRA); if (c?.value) setMarcados(JSON.parse(c.value)); } catch (_) {}
      try { const cat = await window.storage.get(CLAVE_CATEGORIAS); if (cat?.value) setCategoriasManuales(JSON.parse(cat.value)); } catch (_) {}
      try { const ing = await window.storage.get(CLAVE_INGREDIENTES); if (ing?.value) setIngredientesManuales(JSON.parse(ing.value)); } catch (_) {}
      setCargando(false);
    })();
  }, []);

  const persistir = useCallback(async (clave, valor) => {
    try {
      const res = await window.storage.set(clave, JSON.stringify(valor));
      if (!res) throw new Error("sin resultado");
      setEstadoGuardado({ ok: true, en: new Date() });
    } catch (_) {
      setEstadoGuardado({ ok: false, en: new Date() });
    }
  }, []);
  const guardarPlanes = useCallback((n) => persistir(CLAVE_PLANES, n), [persistir]);
  const guardarMarcados = useCallback((n) => persistir(CLAVE_COMPRA, n), [persistir]);
  const guardarCategorias = useCallback((n) => persistir(CLAVE_CATEGORIAS, n), [persistir]);
  const guardarIngredientes = useCallback((n) => persistir(CLAVE_INGREDIENTES, n), [persistir]);

  function getSlots(fk) { return normalizarSlots(planesPorFecha[fk]); }

  function exportarDatos() {
    const payload = { version: 1, exportadoEn: new Date().toISOString(), planesPorFecha, marcados, categoriasManuales, ingredientesManuales };
    try {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `menu-semanal-${claveFecha(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setAviso("Copia exportada");
    } catch (_) {
      setAviso("No se pudo exportar la copia");
    }
    setTimeout(() => setAviso(null), 2400);
  }

  function importarDatos(e) {
    const archivo = e.target.files && e.target.files[0];
    if (!archivo) return;
    const lector = new FileReader();
    lector.onload = () => {
      try {
        const datos = JSON.parse(lector.result);
        if (datos.planesPorFecha) { setPlanesPorFecha(datos.planesPorFecha); guardarPlanes(datos.planesPorFecha); }
        if (datos.marcados) { setMarcados(datos.marcados); guardarMarcados(datos.marcados); }
        if (datos.categoriasManuales) { setCategoriasManuales(datos.categoriasManuales); guardarCategorias(datos.categoriasManuales); }
        if (datos.ingredientesManuales) { setIngredientesManuales(datos.ingredientesManuales); guardarIngredientes(datos.ingredientesManuales); }
        setAviso("Copia importada correctamente");
      } catch (_) {
        setAviso("El archivo no es una copia válida");
      }
      setTimeout(() => setAviso(null), 2600);
    };
    lector.readAsText(archivo);
    e.target.value = "";
  }


  function categoriaEfectiva(texto) {
    const norm = (texto || "").trim().toLowerCase();
    if (norm && categoriasManuales[norm]) return categoriasManuales[norm];
    return categoriaParaTexto(texto);
  }
  function asignarCategoria(texto, catKey) {
    const norm = (texto || "").trim().toLowerCase();
    if (!norm) return;
    setCategoriasManuales((prev) => { const next = { ...prev, [norm]: catKey }; guardarCategorias(next); return next; });
  }

  function abrirAñadirIngredientes(dishNorm) { setAñadiendoIngredientes(dishNorm); setBorradorIngredientes(""); }
  function confirmarIngredientes(dishNorm) {
    const partes = borradorIngredientes.split(",").map((s) => s.trim()).filter(Boolean);
    if (partes.length) {
      setIngredientesManuales((prev) => {
        const actuales = prev[dishNorm] || [];
        const combinados = [...actuales];
        partes.forEach((p) => { const pNorm = p.toLowerCase(); if (!combinados.some((c) => c.toLowerCase() === pNorm)) combinados.push(p); });
        const next = { ...prev, [dishNorm]: combinados };
        guardarIngredientes(next);
        return next;
      });
    }
    setAñadiendoIngredientes(null);
    setBorradorIngredientes("");
  }
  function quitarIngrediente(dishNorm, ingrediente) {
    setIngredientesManuales((prev) => {
      const actuales = (prev[dishNorm] || []).filter((i) => i !== ingrediente);
      const next = { ...prev, [dishNorm]: actuales };
      guardarIngredientes(next);
      return next;
    });
  }

  function empezarNuevoItem(fk, comida) { setEditando({ fk, comida, itemId: null }); setBorrador(""); }
  function empezarEdicionItem(fk, comida, item) { setEditando({ fk, comida, itemId: item.id }); setBorrador(item.texto); }
  function cancelarEdicion() { setEditando(null); setBorrador(""); }

  function guardarItemTexto(fk, comida, itemId, textoRaw) {
    const textoFinal = textoRaw.trim();
    setPlanesPorFecha((prev) => {
      const actual = normalizarSlots(prev[fk]);
      let items = actual[comida].items.slice();
      if (itemId === null) {
        if (textoFinal) items.push({ id: generarId(), texto: textoFinal, creadoEn: new Date().toISOString() });
      } else {
        const idx = items.findIndex((it) => it.id === itemId);
        if (idx >= 0) {
          if (!textoFinal) items.splice(idx, 1);
          else if (textoFinal !== items[idx].texto) items[idx] = { ...items[idx], texto: textoFinal, creadoEn: new Date().toISOString() };
        }
      }
      const next = { ...prev, [fk]: { ...actual, [comida]: { items } } };
      guardarPlanes(next);
      return next;
    });
  }

  function confirmarBorrador() {
    if (!editando) return;
    guardarItemTexto(editando.fk, editando.comida, editando.itemId, borrador);
    setEditando(null); setBorrador("");
  }

  function elegirAutocompletado(texto) {
    if (!editando) return;
    guardarItemTexto(editando.fk, editando.comida, editando.itemId, texto);
    setEditando(null); setBorrador("");
  }

  function borrarItem(fk, comida, itemId) {
    setPlanesPorFecha((prev) => {
      const actual = normalizarSlots(prev[fk]);
      const itemBorrado = actual[comida].items.find((it) => it.id === itemId);
      if (itemBorrado) {
        setUltimoBorrado({ fk, comida, item: itemBorrado });
        setTimeout(() => { setUltimoBorrado((u) => (u && u.item.id === itemBorrado.id ? null : u)); }, 6000);
      }
      const items = actual[comida].items.filter((it) => it.id !== itemId);
      const next = { ...prev, [fk]: { ...actual, [comida]: { items } } };
      guardarPlanes(next);
      return next;
    });
  }

  function deshacerBorrado() {
    if (!ultimoBorrado) return;
    const { fk, comida, item } = ultimoBorrado;
    setPlanesPorFecha((prev) => {
      const actual = normalizarSlots(prev[fk]);
      const items = [...actual[comida].items, item];
      const next = { ...prev, [fk]: { ...actual, [comida]: { items } } };
      guardarPlanes(next);
      return next;
    });
    setUltimoBorrado(null);
  }

  function copiarDiaAnterior(idx) {
    const actual = fechasSemana[idx];
    const anterior = new Date(actual); anterior.setDate(anterior.getDate() - 1);
    const fkAnterior = claveFecha(anterior); const fkActual = claveFecha(actual);
    setPlanesPorFecha((prev) => {
      const origen = normalizarSlots(prev[fkAnterior]);
      const copiado = {};
      COMIDAS.forEach(({ key }) => { copiado[key] = { items: origen[key].items.map((it) => ({ id: generarId(), texto: it.texto, creadoEn: new Date().toISOString() })) }; });
      const next = { ...prev, [fkActual]: copiado };
      guardarPlanes(next);
      return next;
    });
  }

  function limpiarSemanaVisible() {
    setPlanesPorFecha((prev) => {
      const next = { ...prev };
      fechasSemana.forEach((d) => (next[claveFecha(d)] = slotsVacios()));
      guardarPlanes(next);
      return next;
    });
    setBorrarAbierto(false);
  }

  function insertarSugerencia(comida, texto) {
    const textoNorm = texto.toLowerCase();
    const diaDestino = fechasSemana.find((d) => !getSlots(claveFecha(d))[comida].items.some((it) => it.texto.toLowerCase() === textoNorm));
    if (!diaDestino) { setAviso(`"${texto}" ya está en todos los días de esta semana.`); setTimeout(() => setAviso(null), 2600); return; }
    const idx = fechasSemana.indexOf(diaDestino);
    const fk = claveFecha(diaDestino);
    setPlanesPorFecha((prev) => {
      const actual = normalizarSlots(prev[fk]);
      const items = [...actual[comida].items, { id: generarId(), texto, creadoEn: new Date().toISOString() }];
      const next = { ...prev, [fk]: { ...actual, [comida]: { items } } };
      guardarPlanes(next);
      return next;
    });
    setAviso(`"${texto}" añadido a la ${comida} del ${NOMBRES_DIA[idx]}.`);
    setTimeout(() => setAviso(null), 2600);
  }

  function alternarMarcado(claveItem) {
    setMarcados((prev) => { const next = { ...prev, [claveItem]: !prev[claveItem] }; guardarMarcados(next); return next; });
  }

  const totalPlatos = fechasSemana.reduce((acc, d) => acc + COMIDAS.reduce((a, c) => a + getSlots(claveFecha(d))[c.key].items.length, 0), 0);

  const historial = useMemo(() => {
    const h = {}; COMIDAS.forEach((c) => (h[c.key] = {}));
    Object.values(planesPorFecha).forEach((slotsRaw) => {
      const slots = normalizarSlots(slotsRaw);
      COMIDAS.forEach(({ key }) => {
        slots[key].items.forEach((it) => {
          const texto = it.texto.trim(); if (!texto) return;
          const grupo = h[key]; const norm = texto.toLowerCase();
          const existente = Object.keys(grupo).find((k) => k.toLowerCase() === norm);
          const claveFinal = existente || texto;
          const previo = grupo[claveFinal];
          const veces = (previo?.veces || 0) + 1;
          const ultimo = !previo?.ultimo || (it.creadoEn && it.creadoEn > previo.ultimo) ? it.creadoEn : previo.ultimo;
          grupo[claveFinal] = { veces, ultimo };
        });
      });
    });
    return h;
  }, [planesPorFecha]);

  const sugerenciasPorCategoria = useMemo(() => {
    const resultado = {};
    COMIDAS.forEach(({ key }) => {
      const entradas = Object.entries(historial[key] || {});
      entradas.sort((a, b) => b[1].veces - a[1].veces);
      resultado[key] = entradas.slice(0, 8);
    });
    return resultado;
  }, [historial]);

  const hayHistorial = COMIDAS.some((c) => sugerenciasPorCategoria[c.key]?.length > 0);

  function sugerenciasAutocompletar(comida) {
    const entradas = Object.entries(historial[comida] || {});
    const filtro = borrador.trim().toLowerCase();
    let filtradas = entradas;
    if (filtro) filtradas = entradas.filter(([texto]) => texto.toLowerCase().includes(filtro) && texto.toLowerCase() !== filtro);
    filtradas.sort((a, b) => b[1].veces - a[1].veces);
    return filtradas.slice(0, 6);
  }

  function ListaAutocompletar({ comida }) {
    const sugs = sugerenciasAutocompletar(comida);
    if (sugs.length === 0) return null;
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: "0.2rem", maxHeight: 150, overflowY: "auto" }}>
        {sugs.map(([texto, datos]) => (
          <button key={texto} onMouseDown={(e) => e.preventDefault()} onClick={() => elegirAutocompletado(texto)}
            style={{ display: "flex", alignItems: "center", gap: "0.4rem", background: "#3A3D34", border: "1px solid #4C4F43", borderRadius: 6, color: "#F1EAD8", fontSize: "0.75rem", padding: "0.32rem 0.45rem", cursor: "pointer", textAlign: "left" }}>
            <span style={{ fontSize: 14, flex: "0 0 auto" }}>{emojiParaTexto(texto)}</span>
            <span style={{ flex: 1, lineHeight: 1.2 }}>{texto}</span>
            <span style={{ fontSize: "0.6rem", color: "#7C7F70", flex: "0 0 auto" }}>×{datos.veces}</span>
          </button>
        ))}
      </div>
    );
  }

  function formatoFechaCorta(iso) {
    if (!iso) return null;
    return new Date(iso).toLocaleDateString("es-ES", { day: "numeric", month: "short" });
  }

  function calcularDistribucion(clavesFecha) {
    const conteo = {}; CATEGORIAS.forEach((c) => (conteo[c.key] = 0));
    let total = 0;
    clavesFecha.forEach((fk) => {
      const slotsRaw = planesPorFecha[fk]; if (!slotsRaw) return;
      const slots = normalizarSlots(slotsRaw);
      COMIDAS.forEach(({ key }) => {
        slots[key].items.forEach((it) => {
          const texto = it.texto.trim(); if (!texto) return;
          const cat = categoriaEfectiva(texto);
          conteo[cat] = (conteo[cat] || 0) + 1; total += 1;
        });
      });
    });
    return { total, categorias: CATEGORIAS.map((c) => ({ ...c, cantidad: conteo[c.key], pct: total ? Math.round((conteo[c.key] / total) * 100) : 0 })) };
  }

  const distribucionSemana = useMemo(() => calcularDistribucion(fechasSemana.map(claveFecha)), [planesPorFecha, fechasSemana, categoriasManuales]);
  const distribucionAñoSel = useMemo(() => {
    const claves = Object.keys(planesPorFecha).filter((k) => k.startsWith(String(añoSeleccionado)));
    return calcularDistribucion(claves);
  }, [planesPorFecha, añoSeleccionado, categoriasManuales]);

  const datosPorMes = useMemo(() => {
    return Array.from({ length: 12 }, (_, m) => {
      const prefijo = `${añoSeleccionado}-${String(m + 1).padStart(2, "0")}`;
      const claves = Object.keys(planesPorFecha).filter((k) => k.startsWith(prefijo));
      const dist = calcularDistribucion(claves);
      return { mes: m, total: dist.total, categorias: dist.categorias };
    });
  }, [planesPorFecha, añoSeleccionado, categoriasManuales]);

  const claveSemana = claveFecha(semanaBase);
  const listaCompra = useMemo(() => {
    const mapa = new Map();
    fechasSemana.forEach((d) => {
      const slots = getSlots(claveFecha(d));
      COMIDAS.forEach(({ key }) => {
        slots[key].items.forEach((it) => {
          const valor = it.texto.trim(); if (!valor) return;
          const norm = valor.toLowerCase();
          if (mapa.has(norm)) mapa.get(norm).veces += 1;
          else mapa.set(norm, { texto: valor, veces: 1, claveItem: `${claveSemana}::${norm}`, dishNorm: norm, ingredientes: ingredientesManuales[norm] || [] });
        });
      });
    });
    return Array.from(mapa.values()).sort((a, b) => a.texto.localeCompare(b.texto));
  }, [planesPorFecha, fechasSemana, claveSemana, ingredientesManuales]);

  const compraCompletados = listaCompra.filter((it) => marcados[it.claveItem]).length;

  function construirTextoListaCompra() {
    const lineas = [`🛒 Lista de la compra — semana del ${etiquetaSemana}`, ""];
    listaCompra.forEach((item) => {
      lineas.push(`${marcados[item.claveItem] ? "✅" : "⬜"} ${item.texto}${item.veces > 1 ? ` (x${item.veces})` : ""}`);
      item.ingredientes.forEach((ing) => {
        const claveIng = `${item.claveItem}::ing::${ing.toLowerCase()}`;
        lineas.push(`   ${marcados[claveIng] ? "✅" : "⬜"} ${ing}`);
      });
    });
    return lineas.join("\n");
  }

  function compartirListaCompra() {
    const texto = construirTextoListaCompra();
    if (navigator.share) {
      navigator.share({ title: "Lista de la compra", text: texto }).catch(() => {});
      return;
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(texto)
        .then(() => { setAviso("Lista copiada al portapapeles"); setTimeout(() => setAviso(null), 2200); })
        .catch(() => { setAviso("No se pudo copiar la lista"); setTimeout(() => setAviso(null), 2200); });
    } else {
      setAviso("Tu navegador no permite compartir ni copiar aquí");
      setTimeout(() => setAviso(null), 2200);
    }
  }

  const formatoDiaMes = (d) => d.toLocaleDateString("es-ES", { day: "numeric", month: "short" });
  const etiquetaSemana = `${formatoDiaMes(fechasSemana[0])} – ${fechasSemana[6].toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" })}`;
  const esSemanaActual = claveFecha(semanaBase) === claveFecha(lunesDe(new Date()));

  const objetivosSemanaActual = useMemo(() => {
    return objetivosParaSemana(claveSemana).map((o) => ({ ...o, cumplido: o.check(distribucionSemana) }));
  }, [claveSemana, distribucionSemana]);
  const objetivosCumplidosActual = objetivosSemanaActual.filter((o) => o.cumplido).length;
  const trofeoEstaSemana = objetivosSemanaActual.length > 0 && objetivosCumplidosActual === objetivosSemanaActual.length && distribucionSemana.total > 0;

  const semanasConTrofeo = useMemo(() => {
    const mondaySet = new Set();
    Object.keys(planesPorFecha).forEach((fk) => {
      const monday = lunesDe(fechaDesdeClave(fk));
      mondaySet.add(claveFecha(monday));
    });
    const resultados = [];
    mondaySet.forEach((claveM) => {
      const mondayDate = fechaDesdeClave(claveM);
      const fechas7 = Array.from({ length: 7 }, (_, i) => { const dd = new Date(mondayDate); dd.setDate(dd.getDate() + i); return claveFecha(dd); });
      const dist = calcularDistribucion(fechas7);
      if (dist.total === 0) return;
      const objetivos = objetivosParaSemana(claveM).map((o) => ({ ...o, cumplido: o.check(dist) }));
      if (objetivos.every((o) => o.cumplido)) resultados.push({ claveM, mondayDate, objetivos });
    });
    return resultados.sort((a, b) => b.claveM.localeCompare(a.claveM));
  }, [planesPorFecha, categoriasManuales]);

  return (
    <div style={{ minHeight: "100vh", background: "#2B2E28", fontFamily: "'IBM Plex Sans', system-ui, sans-serif", color: "#F1EAD8", padding: "clamp(1rem, 4vw, 3rem)" }}>
      <div style={{ maxWidth: 1180, margin: "0 auto 1.2rem", position: "relative" }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: "1rem" }}>
          <div>
            <div style={{ fontSize: "0.75rem", letterSpacing: "0.18em", textTransform: "uppercase", color: "#E8A93C", marginBottom: "0.4rem" }}>Menú de la semana</div>
            <h1 className="fraunces" style={{ fontSize: "clamp(1.9rem, 4vw, 2.8rem)", fontWeight: 600, margin: 0, lineHeight: 1.05 }}>¿Qué toca comer?</h1>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "0.75rem" }}>
            {pestaña === "planificador" && (
              <div style={{ display: "flex", alignItems: "center", gap: "0.75rem" }}>
                <div style={{ fontSize: "0.8rem", color: "#B7B9AC" }}>{totalPlatos} platos planificados</div>
                {estadoGuardado.ok === false && <div style={{ fontSize: "0.75rem", color: "#E07B5A" }}>⚠ No se ha podido guardar</div>}
                <button onClick={() => setBorrarAbierto(true)} style={{ display: "flex", alignItems: "center", gap: "0.4rem", background: "transparent", border: "1px solid #55584E", color: "#F1EAD8", borderRadius: 8, padding: "0.5rem 0.8rem", fontSize: "0.85rem", cursor: "pointer" }}>
                  <Icono nombre="rotate-ccw" size={14} /> Vaciar esta semana
                </button>
              </div>
            )}
            <div style={{ display: "flex", alignItems: "center", gap: "0.4rem" }}>
              <input ref={inputImportarRef} type="file" accept="application/json" onChange={importarDatos} style={{ display: "none" }} />
              <button onClick={exportarDatos} title="Descargar una copia de seguridad de todos tus datos" style={{ background: "transparent", border: "1px solid #43463C", borderRadius: 8, padding: "0.5rem", color: "#B7B9AC", cursor: "pointer", display: "flex" }}>
                <Icono nombre="download" size={15} />
              </button>
              <button onClick={() => inputImportarRef.current?.click()} title="Importar una copia de seguridad" style={{ background: "transparent", border: "1px solid #43463C", borderRadius: 8, padding: "0.5rem", color: "#B7B9AC", cursor: "pointer", display: "flex" }}>
                <Icono nombre="upload" size={15} />
              </button>
            </div>
          </div>
        </div>

        <svg width="100%" height="10" style={{ marginTop: "1rem" }} viewBox="0 0 800 10" preserveAspectRatio="none">
          <path d="M0 5 Q 100 0, 200 5 T 400 5 T 600 5 T 800 5" stroke="#4C4F44" strokeWidth="2" fill="none" />
        </svg>

        <div style={{ display: "flex", gap: "1.5rem", marginTop: "1.1rem", flexWrap: "wrap" }}>
          <button className="tab-btn" onClick={() => setPestaña("planificador")} style={{ background: "none", border: "none", cursor: "pointer", padding: "0.3rem 0", fontSize: "0.95rem", fontWeight: 600, color: pestaña === "planificador" ? "#F1EAD8" : "#7C7F70", borderBottom: pestaña === "planificador" ? "2px solid #E8A93C" : "2px solid transparent" }}>Planificador</button>
          <button className="tab-btn" onClick={() => setPestaña("sugerencias")} style={{ background: "none", border: "none", cursor: "pointer", padding: "0.3rem 0", fontSize: "0.95rem", fontWeight: 600, display: "flex", alignItems: "center", gap: "0.35rem", color: pestaña === "sugerencias" ? "#F1EAD8" : "#7C7F70", borderBottom: pestaña === "sugerencias" ? "2px solid #E8A93C" : "2px solid transparent" }}>
            <Icono nombre="sparkles" size={15} /> Sugerencias
          </button>
          <button className="tab-btn" onClick={() => setPestaña("compra")} style={{ background: "none", border: "none", cursor: "pointer", padding: "0.3rem 0", fontSize: "0.95rem", fontWeight: 600, display: "flex", alignItems: "center", gap: "0.35rem", color: pestaña === "compra" ? "#F1EAD8" : "#7C7F70", borderBottom: pestaña === "compra" ? "2px solid #E8A93C" : "2px solid transparent" }}>
            <Icono nombre="cart" size={15} /> Compra y objetivos
            {listaCompra.length > 0 && <span style={{ fontSize: "0.68rem", background: "#43463C", borderRadius: 10, padding: "0.05rem 0.45rem", color: "#D9DACC" }}>{compraCompletados}/{listaCompra.length}</span>}
          </button>
        </div>
      </div>

      {!cargando && pestaña !== "planificador" && (
        <div style={{ maxWidth: 1180, margin: "0 auto 1.4rem", background: "#33362E", border: "1px solid #43463C", borderRadius: 10, padding: "0.6rem 0.9rem", display: "flex", flexWrap: "wrap", alignItems: "center", gap: "1.1rem", fontSize: "0.82rem" }}>
          <span style={{ color: "#E8A93C", fontWeight: 600 }}>Hoy</span>
          {COMIDAS.map(({ key, label, emoji, tint }) => {
            const items = getSlots(hoyClave)[key].items;
            const texto = items.length ? items.map((it) => it.texto).join(", ") : "sin planificar";
            return (
              <span key={key} style={{ display: "flex", alignItems: "center", gap: "0.35rem", color: items.length ? "#F1EAD8" : "#7C7F70" }}>
                <span style={{ fontSize: 14 }}>{emoji}</span>
                <strong style={{ color: "#D9DACC", fontWeight: 500 }}>{label}:</strong> {texto}
              </span>
            );
          })}
        </div>
      )}

      {cargando ? (
        <div style={{ maxWidth: 1180, margin: "3rem auto", textAlign: "center", color: "#7C7F70" }}>Cargando tu menú...</div>
      ) : pestaña === "planificador" ? (
        <>
          <div style={{ maxWidth: 1180, margin: "0 auto 1rem", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "0.6rem" }}>
            <div style={{ display: "flex", alignItems: "center", gap: "0.4rem" }}>
              <button className="nav-btn" onClick={() => setSemanaBase((prev) => { const d = new Date(prev); d.setDate(d.getDate() - 7); return d; })} style={{ background: "transparent", border: "1px solid #43463C", borderRadius: 8, padding: "0.4rem", color: "#F1EAD8", cursor: "pointer", display: "flex" }} title="Semana anterior"><Icono nombre="chevron-left" size={16} /></button>
              <div style={{ display: "flex", alignItems: "center", gap: "0.4rem", fontSize: "0.9rem" }}><Icono nombre="calendar" size={14} style={{ color: "#E8A93C" }} />{etiquetaSemana}</div>
              <button className="nav-btn" onClick={() => setSemanaBase((prev) => { const d = new Date(prev); d.setDate(d.getDate() + 7); return d; })} style={{ background: "transparent", border: "1px solid #43463C", borderRadius: 8, padding: "0.4rem", color: "#F1EAD8", cursor: "pointer", display: "flex" }} title="Semana siguiente"><Icono nombre="chevron-right" size={16} /></button>
            </div>
            {!esSemanaActual && <button onClick={() => setSemanaBase(lunesDe(new Date()))} style={{ background: "transparent", border: "1px solid #E8A93C", color: "#E8A93C", borderRadius: 8, padding: "0.35rem 0.75rem", fontSize: "0.8rem", cursor: "pointer" }}>Ir a esta semana</button>}
          </div>

          {borrarAbierto && (
            <div style={{ maxWidth: 1180, margin: "0 auto 1.5rem", background: "#3A3D34", border: "1px solid #55584E", borderRadius: 12, padding: "1rem 1.2rem", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "0.75rem" }}>
              <span style={{ fontSize: "0.9rem" }}>¿Vaciar el menú de esta semana ({etiquetaSemana})? No afecta a otras semanas ni al historial.</span>
              <div style={{ display: "flex", gap: "0.5rem" }}>
                <button onClick={limpiarSemanaVisible} style={{ background: "#C77B4F", border: "none", color: "#1E201C", borderRadius: 8, padding: "0.45rem 0.9rem", fontSize: "0.85rem", cursor: "pointer", fontWeight: 600 }}>Sí, vaciar</button>
                <button onClick={() => setBorrarAbierto(false)} style={{ background: "transparent", border: "1px solid #55584E", color: "#F1EAD8", borderRadius: 8, padding: "0.45rem 0.9rem", fontSize: "0.85rem", cursor: "pointer" }}>Cancelar</button>
              </div>
            </div>
          )}

          <div style={{ maxWidth: 1180, margin: "0 auto 1rem", display: "flex", gap: "0.6rem", flexWrap: "wrap" }}>
            {COMIDAS.map(({ key, label, emoji, tint }) => (
              <div key={key} className="chip" style={{ display: "flex", alignItems: "center", gap: "0.4rem", background: "#33362E", border: `1px solid ${tint}55`, borderRadius: 20, padding: "0.3rem 0.7rem", fontSize: "0.78rem", color: "#D9DACC" }}>
                <span style={{ fontSize: 13 }}>{emoji}</span>{label}
              </div>
            ))}
            <div style={{ display: "flex", alignItems: "center", gap: "0.35rem", fontSize: "0.75rem", color: "#7C7F70" }}><Icono nombre="plus" size={12} /> puedes añadir varias opciones por casilla</div>
          </div>

          <div style={{ maxWidth: 1180, margin: "0 auto", display: "grid", gridTemplateColumns: "minmax(90px, 120px) repeat(7, minmax(160px, 1fr))", gap: "0.5rem", overflowX: "auto" }}>
            <div />
            {fechasSemana.map((d, idx) => {
              const fk = claveFecha(d); const esHoy = fk === hoyClave;
              return (
                <div key={fk} style={{ position: "relative", textAlign: "center", paddingBottom: "0.5rem" }}>
                  <div className="fraunces" style={{ fontSize: "1.05rem", fontWeight: 600, color: esHoy ? "#E8A93C" : "#F1EAD8" }}>{NOMBRES_DIA[idx]}</div>
                  <div style={{ fontSize: "0.72rem", color: esHoy ? "#E8A93C" : "#8A8D80" }}>{formatoDiaMes(d)}{esHoy ? " · Hoy" : ""}</div>
                  <button onClick={() => copiarDiaAnterior(idx)} title="Copiar el menú del día anterior" style={{ position: "absolute", top: 0, right: 0, background: "transparent", border: "none", color: "#7C7F70", cursor: "pointer", padding: 2 }}><Icono nombre="copy" size={12} /></button>
                </div>
              );
            })}

            {COMIDAS.map(({ key, label, emoji, tint }) => (
              <Fragment key={key}>
                <div style={{ display: "flex", alignItems: "center", gap: "0.4rem", color: tint, fontSize: "0.85rem", fontWeight: 500, paddingTop: "0.6rem" }}><span style={{ fontSize: 15 }}>{emoji}</span>{label}</div>
                {fechasSemana.map((d) => {
                  const fk = claveFecha(d);
                  const items = getSlots(fk)[key].items;
                  const editandoNuevoAqui = editando && editando.fk === fk && editando.comida === key && editando.itemId === null;
                  return (
                    <div key={fk + key} style={{ background: "#33362E", border: "1px solid #43463C", borderRadius: 10, minHeight: 104, padding: "0.75rem", display: "flex", flexDirection: "column", gap: "0.35rem" }}>
                      {items.map((item) => {
                        const emojiPlato = emojiParaTexto(item.texto);
                        const editandoEste = editando && editando.fk === fk && editando.comida === key && editando.itemId === item.id;
                        return editandoEste ? (
                          <div key={item.id} style={{ display: "flex", flexDirection: "column", gap: "0.3rem" }}>
                            <textarea autoFocus value={borrador} onChange={(e) => setBorrador(e.target.value)} onBlur={confirmarBorrador}
                              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.blur(); } if (e.key === "Escape") { e.preventDefault(); cancelarEdicion(); } }}
                              style={{ width: "100%", background: "#3A3D34", border: `1px solid ${tint}`, borderRadius: 6, color: "#F1EAD8", fontSize: "0.82rem", resize: "none", fontFamily: "inherit", padding: "0.3rem 0.4rem", minHeight: 36 }} />
                            <ListaAutocompletar comida={key} />
                            <SelectorCategoria texto={borrador || item.texto} actual={categoriaEfectiva(borrador || item.texto)} onElegir={asignarCategoria} />
                          </div>
                        ) : (
                          <div key={item.id} className="item-fila" style={{ display: "flex", alignItems: "flex-start", gap: "0.4rem", borderRadius: 6, padding: "0.15rem" }}>
                            <button className="celda-btn" onClick={() => empezarEdicionItem(fk, key, item)} style={{ flex: "1 1 auto", display: "flex", alignItems: "flex-start", gap: "0.5rem", background: "transparent", border: "none", textAlign: "left", color: "#F1EAD8", cursor: "pointer", fontSize: "0.98rem", fontFamily: "inherit", lineHeight: 1.4 }}>
                              <span style={{ flex: "0 0 auto", width: 44, height: 44, position: "relative", display: "flex", alignItems: "center", justifyContent: "center", background: `${tint}26`, border: `1px solid ${tint}66`, borderRadius: 8, fontSize: 24 }}>
                                {emojiPlato}
                                {(() => {
                                  const catInfo = CATEGORIAS.find((c) => c.key === categoriaEfectiva(item.texto));
                                  return (
                                    <span style={{ position: "absolute", bottom: -4, right: -4, width: 14, height: 14, borderRadius: "50%", background: catInfo?.tint || "#8A7FBF", border: "1.5px solid #33362E", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "0.55rem", fontWeight: 700, color: "#1E201C", lineHeight: 1 }} title={`Categoría: ${catInfo?.label || "Otros"}`}>
                                      {catInfo?.letra || "O"}
                                    </span>
                                  );
                                })()}
                              </span>
                              <span style={{ paddingTop: "0.1rem" }}>
                                <span style={{ whiteSpace: "pre-wrap" }}>{item.texto}</span>
                                {item.creadoEn && <span style={{ display: "flex", alignItems: "center", gap: "0.25rem", fontSize: "0.65rem", color: "#8A8D80", marginTop: "0.15rem" }}><Icono nombre="clock" size={10} />{formatoSello(item.creadoEn)}</span>}
                              </span>
                            </button>
                            <button onClick={() => borrarItem(fk, key, item.id)} title="Quitar" style={{ background: "transparent", border: "none", color: "#7C7F70", cursor: "pointer", padding: 2, flex: "0 0 auto" }}><Icono nombre="x" size={12} /></button>
                          </div>
                        );
                      })}

                      {editandoNuevoAqui ? (
                        <div style={{ display: "flex", flexDirection: "column", gap: "0.3rem" }}>
                          <textarea autoFocus value={borrador} onChange={(e) => setBorrador(e.target.value)} onBlur={confirmarBorrador}
                            onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.blur(); } if (e.key === "Escape") { e.preventDefault(); cancelarEdicion(); } }}
                            placeholder={`Añadir ${label.toLowerCase()}...`}
                            style={{ width: "100%", background: "#3A3D34", border: `1px solid ${tint}`, borderRadius: 6, color: "#F1EAD8", fontSize: "0.82rem", resize: "none", fontFamily: "inherit", padding: "0.3rem 0.4rem", minHeight: 36 }} />
                          <ListaAutocompletar comida={key} />
                          {borrador.trim() && <SelectorCategoria texto={borrador} actual={categoriaEfectiva(borrador)} onElegir={asignarCategoria} />}
                        </div>
                      ) : (
                        <button className="btn-anadir" onClick={() => empezarNuevoItem(fk, key)} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "0.3rem", background: "transparent", border: `1px dashed ${tint}66`, borderRadius: 7, color: tint, fontSize: "0.72rem", padding: "0.35rem", cursor: "pointer" }}>
                          <Icono nombre="plus" size={12} /> {items.length === 0 ? "Añadir" : "Otra opción"}
                        </button>
                      )}
                    </div>
                  );
                })}
              </Fragment>
            ))}
          </div>

          <div style={{ maxWidth: 1180, margin: "1.5rem auto 0", fontSize: "0.75rem", color: "#7C7F70", display: "flex", alignItems: "center", gap: "0.3rem" }}>
            <Icono nombre="chevron-down" size={12} style={{ transform: "rotate(-90deg)" }} />
            El calendario avanza solo con la fecha real. Al editar un plato puedes corregir su categoría nutricional (el punto de color junto al icono).
          </div>
        </>
      ) : pestaña === "sugerencias" ? (
        <div style={{ maxWidth: 1180, margin: "0 auto" }}>
          <div style={{ marginBottom: "2.2rem" }}>
            <div className="fraunces" style={{ fontSize: "1.25rem", fontWeight: 600, marginBottom: "0.3rem" }}>Estimación nutricional aproximada</div>
            <div style={{ fontSize: "0.78rem", color: "#7C7F70", marginBottom: "1.1rem" }}>Distribución por tipo de plato, calculada según las palabras de cada plato planificado. Es una orientación, no un análisis nutricional real (no calcula calorías ni gramos).</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: "1.2rem" }}>
              <BloqueDistribucion titulo={`Esta semana (${etiquetaSemana})`} datos={distribucionSemana} />
              <div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "0.4rem" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: "0.3rem" }}>
                    <button onClick={() => setAñoSeleccionado((a) => a - 1)} style={{ background: "transparent", border: "1px solid #43463C", borderRadius: 6, padding: "0.2rem", color: "#F1EAD8", cursor: "pointer", display: "flex" }} title="Año anterior"><Icono nombre="chevron-left" size={13} /></button>
                    <span style={{ fontSize: "0.78rem", color: "#B7B9AC" }}>Acumulado {añoSeleccionado}</span>
                    <button onClick={() => setAñoSeleccionado((a) => a + 1)} style={{ background: "transparent", border: "1px solid #43463C", borderRadius: 6, padding: "0.2rem", color: "#F1EAD8", cursor: "pointer", display: "flex" }} title="Año siguiente"><Icono nombre="chevron-right" size={13} /></button>
                  </div>
                  {añoSeleccionado !== new Date().getFullYear() && (
                    <button onClick={() => setAñoSeleccionado(new Date().getFullYear())} style={{ background: "transparent", border: "none", color: "#E8A93C", fontSize: "0.72rem", cursor: "pointer", padding: 0 }}>Este año</button>
                  )}
                </div>
                <BloqueDistribucion titulo="" datos={distribucionAñoSel} />
              </div>
            </div>
            <div style={{ marginTop: "1.2rem" }}>
              <GraficoMensual datos={datosPorMes} año={añoSeleccionado} />
            </div>
          </div>

          <div style={{ marginBottom: "1.2rem", borderTop: "1px solid #43463C", paddingTop: "1.4rem" }}>
            {!hayHistorial ? (
              <div style={{ background: "#33362E", border: "1px solid #43463C", borderRadius: 12, padding: "2rem", textAlign: "center", color: "#B7B9AC" }}>
                <Icono nombre="info" size={22} style={{ marginBottom: "0.6rem", color: "#E8A93C" }} />
                <div style={{ fontSize: "0.95rem" }}>Todavía no hay historial. En cuanto planifiques platos, aquí aparecerán como propuestas rápidas para repetir.</div>
              </div>
            ) : (
              COMIDAS.map(({ key, label, emoji, tint }) => {
                const lista = sugerenciasPorCategoria[key];
                if (!lista || lista.length === 0) return null;
                return (
                  <div key={key} style={{ marginBottom: "1.8rem" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: "0.5rem", marginBottom: "0.7rem" }}>
                      <span style={{ fontSize: 16 }}>{emoji}</span>
                      <span className="fraunces" style={{ fontSize: "1.15rem", fontWeight: 600 }}>{label}</span>
                      <span style={{ fontSize: "0.75rem", color: "#7C7F70" }}>propuestas según tu historial</span>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: "0.7rem" }}>
                      {lista.map(([texto, datos]) => {
                        const emojiPlato = emojiParaTexto(texto);
                        return (
                          <div key={texto} className="sug-tile" onClick={() => insertarSugerencia(key, texto)} style={{ aspectRatio: "1 / 1", background: "#33362E", border: "1px solid #43463C", borderRadius: 12, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "0.35rem", padding: "0.75rem", textAlign: "center", position: "relative" }}>
                            <span style={{ width: 48, height: 48, borderRadius: 10, background: `${tint}26`, border: `1px solid ${tint}66`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>{emojiPlato}</span>
                            <span style={{ fontSize: "0.74rem", lineHeight: 1.25, color: "#F1EAD8" }}>{texto}</span>
                            {datos.ultimo && <span style={{ fontSize: "0.62rem", color: "#8A8D80" }}>Última vez: {formatoFechaCorta(datos.ultimo)}</span>}
                            <span style={{ position: "absolute", top: 4, right: 6, fontSize: "0.62rem", color: "#7C7F70" }}>×{datos.veces}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })
            )}
            <div style={{ fontSize: "0.75rem", color: "#7C7F70", marginTop: "0.5rem" }}>Toca una propuesta para añadirla como opción en el primer día de esta semana donde todavía no esté.</div>
          </div>
        </div>
      ) : (
        <div style={{ maxWidth: 720, margin: "0 auto" }}>
          <div style={{ marginBottom: "1.6rem" }}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: "0.6rem" }}>
              <div className="fraunces" style={{ fontSize: "1.1rem", fontWeight: 600 }}>Objetivos de esta semana</div>
              {trofeoEstaSemana && <span style={{ fontSize: "0.8rem" }}>🏆 ¡Conseguido!</span>}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: "0.5rem" }}>
              {objetivosSemanaActual.map((obj) => (
                <div key={obj.id} style={{ display: "flex", alignItems: "center", gap: "0.6rem", borderRadius: 10, padding: "0.55rem 0.75rem", border: `1px solid ${obj.cumplido ? "#E8A93C" : "#43463C"}`, background: obj.cumplido ? "#E8A93C1f" : "#33362E" }}>
                  <span style={{ flex: "0 0 auto", width: 22, height: 22, borderRadius: "50%", border: `1.5px solid ${obj.cumplido ? "#E8A93C" : "#6E7164"}`, background: obj.cumplido ? "#E8A93C" : "transparent", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    {obj.cumplido && <Icono nombre="check" size={13} style={{ color: "#1E201C" }} />}
                  </span>
                  <span style={{ fontSize: "0.85rem", color: obj.cumplido ? "#F1EAD8" : "#D9DACC" }}>{obj.texto}</span>
                </div>
              ))}
            </div>
            <div style={{ fontSize: "0.72rem", color: "#7C7F70", marginTop: "0.5rem" }}>Se eligen solos cada semana y se marcan según lo que vayas planificando. Consigue los 3 para ganar un trofeo.</div>
          </div>

          <div style={{ fontSize: "0.8rem", color: "#7C7F70", marginBottom: "0.8rem" }}>Semana del {etiquetaSemana}</div>
          {listaCompra.length === 0 ? (
            <div style={{ background: "#33362E", border: "1px solid #43463C", borderRadius: 12, padding: "2rem", textAlign: "center", color: "#B7B9AC" }}>
              <Icono nombre="cart" size={22} style={{ marginBottom: "0.6rem", color: "#E8A93C" }} />
              <div style={{ fontSize: "0.95rem" }}>Todavía no hay nada que comprar esta semana. Planifica algún plato en la primera pestaña y aparecerá aquí automáticamente.</div>
            </div>
          ) : (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: "1rem" }}>
                <span className="fraunces" style={{ fontSize: "1.2rem", fontWeight: 600 }}>Para esta semana</span>
                <div style={{ display: "flex", alignItems: "center", gap: "0.7rem" }}>
                  <span style={{ fontSize: "0.8rem", color: "#7C7F70" }}>{compraCompletados} de {listaCompra.length} conseguidos</span>
                  <button onClick={compartirListaCompra} title="Compartir o copiar la lista" style={{ display: "flex", alignItems: "center", gap: "0.3rem", background: "transparent", border: "1px solid #43463C", borderRadius: 8, padding: "0.35rem 0.6rem", fontSize: "0.75rem", color: "#B7B9AC", cursor: "pointer" }}>
                    <Icono nombre="share" size={13} /> Compartir
                  </button>
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: "0.5rem" }}>
                {listaCompra.map((item) => {
                  const emojiPlato = emojiParaTexto(item.texto);
                  const hecho = !!marcados[item.claveItem];
                  const editandoIngredientes = añadiendoIngredientes === item.dishNorm;
                  return (
                    <div key={item.claveItem} style={{ background: "#33362E", border: "1px solid #43463C", borderRadius: 12, padding: "0.65rem 0.8rem" }}>
                      <div className="compra-fila" onClick={() => alternarMarcado(item.claveItem)} style={{ display: "flex", alignItems: "center", gap: "0.75rem", cursor: "pointer", opacity: hecho ? 0.55 : 1, borderRadius: 8 }}>
                        <span style={{ flex: "0 0 auto", width: 26, height: 26, borderRadius: 7, border: `1.5px solid ${hecho ? "#E8A93C" : "#6E7164"}`, background: hecho ? "#E8A93C" : "transparent", display: "flex", alignItems: "center", justifyContent: "center" }}>
                          {hecho && <Icono nombre="check" size={16} style={{ color: "#1E201C" }} />}
                        </span>
                        <span style={{ flex: "0 0 auto", width: 44, height: 44, borderRadius: 10, background: "#3A3D34", border: "1px solid #4C4F44", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22 }}>{emojiPlato}</span>
                        <span style={{ flex: "1 1 auto", fontSize: "0.92rem", textDecoration: hecho ? "line-through" : "none" }}>{item.texto}</span>
                        {item.veces > 1 && <span style={{ fontSize: "0.72rem", color: "#7C7F70" }}>×{item.veces}</span>}
                      </div>

                      {item.ingredientes.length > 0 && (
                        <div style={{ display: "flex", flexDirection: "column", gap: "0.3rem", marginTop: "0.5rem", paddingLeft: "2.4rem" }}>
                          {item.ingredientes.map((ing) => {
                            const claveIng = `${item.claveItem}::ing::${ing.toLowerCase()}`;
                            const ingHecho = !!marcados[claveIng];
                            return (
                              <div key={ing} style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
                                <span onClick={() => alternarMarcado(claveIng)} style={{ flex: "0 0 auto", width: 18, height: 18, borderRadius: 5, border: `1.5px solid ${ingHecho ? "#E8A93C" : "#6E7164"}`, background: ingHecho ? "#E8A93C" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
                                  {ingHecho && <Icono nombre="check" size={12} style={{ color: "#1E201C" }} />}
                                </span>
                                <span style={{ flex: "1 1 auto", fontSize: "0.82rem", color: "#D9DACC", textDecoration: ingHecho ? "line-through" : "none" }}>{ing}</span>
                                <button onClick={() => quitarIngrediente(item.dishNorm, ing)} title="Quitar" style={{ background: "transparent", border: "none", color: "#7C7F70", cursor: "pointer", padding: 2 }}>
                                  <Icono nombre="x" size={11} />
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      )}

                      <div style={{ paddingLeft: "2.4rem", marginTop: "0.4rem" }}>
                        {editandoIngredientes ? (
                          <input
                            autoFocus
                            value={borradorIngredientes}
                            onChange={(e) => setBorradorIngredientes(e.target.value)}
                            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); confirmarIngredientes(item.dishNorm); } if (e.key === "Escape") { e.preventDefault(); setAñadiendoIngredientes(null); } }}
                            onBlur={() => confirmarIngredientes(item.dishNorm)}
                            placeholder="lentejas, chorizo, cebolla..."
                            style={{ width: "100%", background: "#3A3D34", border: "1px solid #E8A93C", borderRadius: 6, color: "#F1EAD8", fontSize: "0.8rem", padding: "0.3rem 0.5rem" }}
                          />
                        ) : (
                          <button onClick={() => abrirAñadirIngredientes(item.dishNorm)} style={{ display: "flex", alignItems: "center", gap: "0.3rem", background: "transparent", border: "1px dashed #55584E", borderRadius: 7, color: "#8A8D80", fontSize: "0.72rem", padding: "0.3rem 0.5rem", cursor: "pointer" }}>
                            <Icono nombre="plus" size={11} /> Añadir ingredientes
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{ fontSize: "0.75rem", color: "#7C7F70", marginTop: "1rem" }}>Se genera a partir de los platos planificados en la semana que estés viendo. Puedes desglosar cada plato en sus ingredientes; se recuerdan para la próxima vez que repitas ese plato.</div>
            </>
          )}

          <div style={{ marginTop: "2.4rem", borderTop: "1px solid #43463C", paddingTop: "1.4rem" }}>
            <div className="fraunces" style={{ fontSize: "1.1rem", fontWeight: 600, marginBottom: "0.6rem" }}>🏆 Trofeos semanales</div>
            {semanasConTrofeo.length === 0 ? (
              <div style={{ fontSize: "0.8rem", color: "#7C7F70" }}>Todavía no hay trofeos. Cumple los 3 objetivos de una semana para ganar el primero.</div>
            ) : (
              <div style={{ display: "flex", flexWrap: "wrap", gap: "0.6rem" }}>
                {semanasConTrofeo.map(({ claveM, mondayDate }) => {
                  const domingo = new Date(mondayDate);
                  domingo.setDate(domingo.getDate() + 6);
                  return (
                    <div key={claveM} title={`Semana del ${formatoDiaMes(mondayDate)} al ${formatoDiaMes(domingo)}`} style={{ display: "flex", alignItems: "center", gap: "0.4rem", background: "#33362E", border: "1px solid #E8A93C66", borderRadius: 20, padding: "0.4rem 0.8rem", fontSize: "0.78rem" }}>
                      <span style={{ fontSize: "1rem" }}>🏆</span>
                      {formatoDiaMes(mondayDate)} – {formatoDiaMes(domingo)}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      )}

      {ultimoBorrado && (
        <div style={{ position: "fixed", bottom: aviso ? 68 : 20, left: "50%", transform: "translateX(-50%)", background: "#3A3D34", border: "1px solid #55584E", color: "#F1EAD8", borderRadius: 10, padding: "0.6rem 0.9rem", fontSize: "0.85rem", boxShadow: "0 6px 20px rgba(0,0,0,0.35)", zIndex: 51, display: "flex", alignItems: "center", gap: "0.7rem" }}>
          <span>"{ultimoBorrado.item.texto}" eliminado</span>
          <button onClick={deshacerBorrado} style={{ display: "flex", alignItems: "center", gap: "0.3rem", background: "transparent", border: "none", color: "#E8A93C", fontWeight: 600, cursor: "pointer", fontSize: "0.85rem" }}>
            <Icono nombre="undo" size={14} /> Deshacer
          </button>
        </div>
      )}

      {aviso && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: "#3A3D34", border: "1px solid #E8A93C", color: "#F1EAD8", borderRadius: 10, padding: "0.6rem 1rem", fontSize: "0.85rem", boxShadow: "0 6px 20px rgba(0,0,0,0.35)", zIndex: 50 }}>
          {aviso}
        </div>
      )}
    </div>
  );
}

function SelectorCategoria({ texto, actual, onElegir }) {
  return (
    <div style={{ display: "flex", gap: "0.3rem", flexWrap: "wrap", padding: "0 0.1rem" }}>
      {CATEGORIAS.map((cat) => {
        const activa = actual === cat.key;
        return (
          <button key={cat.key} type="button" onMouseDown={(e) => e.preventDefault()} onClick={() => onElegir(texto, cat.key)}
            style={{ fontSize: "0.62rem", padding: "0.15rem 0.45rem", borderRadius: 20, border: `1px solid ${activa ? cat.tint : cat.tint + "55"}`, background: activa ? cat.tint + "33" : "transparent", color: "#F1EAD8", cursor: "pointer" }}>
            {cat.label}
          </button>
        );
      })}
    </div>
  );
}

function BloqueDistribucion({ titulo, datos }) {
  return (
    <div style={{ background: "#33362E", border: "1px solid #43463C", borderRadius: 12, padding: "1.1rem 1.2rem" }}>
      {titulo && <div style={{ fontSize: "0.85rem", fontWeight: 600, marginBottom: "0.2rem" }}>{titulo}</div>}
      <div style={{ fontSize: "0.72rem", color: "#7C7F70", marginBottom: "0.9rem" }}>{datos.total > 0 ? `${datos.total} platos planificados` : "Sin datos todavía"}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: "0.55rem" }}>
        {datos.categorias.map((c) => (
          <div key={c.key}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.78rem", marginBottom: "0.2rem" }}><span>{c.label}</span><span style={{ color: "#B7B9AC" }}>{c.pct}%</span></div>
            <div className="barra-fondo"><div className="barra-relleno" style={{ width: `${c.pct}%`, background: c.tint }} /></div>
          </div>
        ))}
      </div>
    </div>
  );
}

const NOMBRES_MES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

function GraficoMensual({ datos, año }) {
  const maxTotal = Math.max(1, ...datos.map((d) => d.total));
  const hayDatos = datos.some((d) => d.total > 0);
  return (
    <div style={{ background: "#33362E", border: "1px solid #43463C", borderRadius: 12, padding: "1.1rem 1.2rem" }}>
      <div style={{ fontSize: "0.85rem", fontWeight: 600, marginBottom: "0.2rem" }}>Comparativa mensual por categoría — {año}</div>
      <div style={{ fontSize: "0.72rem", color: "#7C7F70", marginBottom: "1rem" }}>
        {hayDatos ? "Cada barra es un mes; los colores muestran qué categorías lo componen." : "Sin datos todavía para este año."}
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: "0.4rem", height: 150, overflowX: "auto" }}>
        {datos.map((d) => {
          const alturaTotal = d.total > 0 ? Math.max(6, (d.total / maxTotal) * 130) : 3;
          return (
            <div key={d.mes} style={{ flex: "1 1 0", minWidth: 20, display: "flex", flexDirection: "column", alignItems: "center", gap: "0.35rem" }}>
              <div
                title={`${NOMBRES_MES[d.mes]}: ${d.total} platos`}
                style={{ width: "100%", maxWidth: 28, height: alturaTotal, display: "flex", flexDirection: "column-reverse", borderRadius: 4, overflow: "hidden", background: d.total > 0 ? "transparent" : "#3A3D34" }}
              >
                {d.categorias.filter((c) => c.cantidad > 0).map((c) => (
                  <div key={c.key} style={{ width: "100%", height: `${(c.cantidad / d.total) * 100}%`, background: c.tint }} />
                ))}
              </div>
              <span style={{ fontSize: "0.62rem", color: "#8A8D80" }}>{NOMBRES_MES[d.mes]}</span>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "0.6rem", marginTop: "1rem" }}>
        {CATEGORIAS.map((c) => (
          <div key={c.key} style={{ display: "flex", alignItems: "center", gap: "0.3rem", fontSize: "0.68rem", color: "#B7B9AC" }}>
            <span style={{ width: 8, height: 8, borderRadius: 2, background: c.tint, display: "inline-block" }} />
            {c.label}
          </div>
        ))}
      </div>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<PlanificadorComidas />);
} catch (errorArranque) {
  document.getElementById("root").innerHTML =
    '<div style="font-family: monospace; background:#2B2E28; color:#F1EAD8; padding:2rem; white-space:pre-wrap;">' +
    "Error al iniciar la app:\n\n" + (errorArranque && errorArranque.message ? errorArranque.message : String(errorArranque)) +
    "</div>";
}
</script>

  try {

    var resultado = Babel.transform(codigoFuente, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var scriptFinal = document.createElement("script");

    document.body.appendChild(scriptFinal);
  } catch (errorCompilacion) {
    document.getElementById("root").innerHTML =
      '<div style="font-family: monospace; background:#2B2E28; color:#F1EAD8; padding:2rem; white-space:pre-wrap;">' +
      "Error al compilar la app:\n\n" + (errorCompilacion && errorCompilacion.message ? errorCompilacion.message : String(errorCompilacion)) +
